name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push baru membatalkan run lama pada ref yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test dan build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependency
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
