<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bayt Mustaqbal — aplikasi manajemen keluarga: keuangan, agenda, absensi, dan service.">
  <meta name="theme-color" id="theme-color-meta" content="#0A192F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" id="apple-status-style" content="black">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Fonts: Plus Jakarta Sans (teks) + Fira Code (angka/KPI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS diproses PostCSS (lihat tailwind.config.js) via App.css -->

  <!-- App Icon -->
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <title>Bayt Mustaqbal — Manajemen Keluarga</title>

  <!-- Warna latar paling awal: mencegah kedipan putih sebelum bundel CSS/JS
       selesai dimuat. Nilainya kembar dengan token di App.css. -->
  <style>
    html { background-color: #0A192F; }
    html[data-theme='light'] { background-color: #F2FAFD; }
  </style>

  <!-- Tema sebelum render ("anti-kedip"): atribut `data-theme` disetel SEBELUM
       React jalan, jadi tidak ada kilatan tema salah saat app dibuka.
       Sumber kebenaran nilai yang sama ada di App.jsx (localStorage 'bm-theme').
       Pilihan: 'light' | 'dark' | 'system' (tanpa isi/rusak = 'system'). -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('bm-theme');
        var pilihan = stored === 'light' || stored === 'dark' ? stored : 'system';
        var sistemTerang = window.matchMedia('(prefers-color-scheme: light)').matches;
        var tema = pilihan === 'system' ? (sistemTerang ? 'light' : 'dark') : pilihan;
        var akar = document.documentElement;
        akar.setAttribute('data-theme', tema);
        akar.style.colorScheme = tema;
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', tema === 'light' ? '#F2FAFD' : '#0A192F');
        var statusBar = document.getElementById('apple-status-style');
        if (statusBar) statusBar.setAttribute('content', tema === 'light' ? 'default' : 'black');
        window.__bmTheme = tema; // penanda agar bisa diperiksa (mis. saat verifikasi)
      } catch (e) {
        /* localStorage dilarang / matchMedia tak ada → biarkan default gelap */
      }
    })();
  </script>
</head>
<body class="bg-canvas font-sans text-ink antialiased">
  <!-- Skip link (aksesibilitas keyboard) -->
  <a href="#main"
     class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-cta focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">
    Lewati ke konten utama
  </a>

  <div id="root"></div>

  <!-- Popup "Pasang app" — kecil, muncul 5 detik lalu hilang sendiri.
       Muncul lagi tiap app dibuka / browser di-refresh; TIDAK akan muncul lagi
       setelah app benar-benar terpasang (event appinstalled atau mode standalone).
       Ditaruh di index.html supaya bisa jalan sebelum React dan memakai event
       beforeinstallprompt apa adanya. Tampilnya menunggu pengguna melewati layar
       gerbang (event 'bm:entered' dari App.jsx) — kalau tidak, popup (z-60) akan
       tersembunyi di balik gerbang (z-90). -->
  <div id="install-prompt"
       class="pointer-events-none fixed inset-x-0 bottom-[calc(3.5rem_+_env(safe-area-inset-bottom)_+_0.75rem)] z-[60] justify-center px-4 lg:bottom-6 lg:justify-end lg:px-6"
       style="display: none;">
    <div id="install-prompt-card"
         role="status"
         class="pointer-events-auto flex w-full max-w-sm flex-col gap-2.5 rounded-2xl border border-line bg-surface/95 p-2.5 shadow-pop backdrop-blur-xl transition-[opacity,transform] duration-200 ease-smooth sm:max-w-md sm:flex-row sm:items-center"
         style="opacity: 0; transform: translateY(0.5rem);">
      <div class="flex min-w-0 flex-1 items-center gap-2.5">
        <span class="grid h-9 w-9 shrink-0 place-items-center overflow-hidden rounded-xl border border-brand/25 bg-brand/10">
          <img src="icons/icon-192.png" alt="" class="h-full w-full object-cover" />
        </span>
        <div class="min-w-0 flex-1 leading-tight">
          <p class="truncate text-sm font-semibold">Pasang Bayt Mustaqbal</p>
          <p class="truncate text-xs text-mutedfg">Akses cepat dari layar utama</p>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-2">
        <button type="button" onclick="window.installApp()"
                class="inline-flex min-h-[44px] flex-1 items-center justify-center gap-1.5 rounded-xl bg-gradient-to-r from-[#1D4ED8] to-[#2563EB] px-3.5 text-sm font-semibold text-white shadow-glow transition-transform hover:from-[#1E40AF] hover:to-[#1D4ED8] active:scale-[0.99] sm:flex-none">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="m7 10 5 5 5-5" />
            <path d="M12 15V3" />
          </svg>
          Pasang
        </button>
        <button type="button" onclick="window.hideInstallPrompt()" aria-label="Tutup tawaran pasang"
                class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-mutedfg transition-colors hover:bg-muted hover:text-ink">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- React entry -->
  <script type="module" src="/main.jsx"></script>

  <!-- Network status + PWA install logic -->
  <script>
    // ---- Notifikasi perubahan status jaringan (toast sementara) ----
    // Status "offline" yang menetap ditampilkan banner di dalam <main> (App.jsx),
    // jadi bar ini hanya muncul sesaat saat status berubah → tidak dobel.
    let networkToastTimer = null;
    function showNetworkToast(isOnline) {
      const existing = document.getElementById('network-status-bar');
      if (existing) existing.remove();
      if (networkToastTimer) clearTimeout(networkToastTimer);

      const bar = document.createElement('div');
      bar.id = 'network-status-bar';
      bar.setAttribute('role', 'status');
      bar.setAttribute('aria-live', 'polite');
      bar.className =
        'fixed inset-x-0 top-0 z-[70] flex items-center justify-center gap-2 px-4 py-2 text-center text-sm font-medium text-white transition-transform duration-200';
      bar.style.backgroundColor = isOnline ? '#155E75' : '#BE123C';
      bar.innerHTML =
        '<span aria-hidden="true" style="display:inline-block;width:8px;height:8px;border-radius:9999px;background:currentColor;opacity:.9"></span>' +
        (isOnline ? 'Tersambung kembali' : 'Koneksi terputus');

      document.body.appendChild(bar);

      networkToastTimer = setTimeout(() => {
        bar.style.transform = 'translateY(-100%)';
        setTimeout(() => bar.remove(), 250);
      }, 3000);
    }

    window.addEventListener('online', () => {
      showNetworkToast(true);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready
          .then((reg) => reg.sync && reg.sync.register('family-api-sync'))
          .catch(() => {});
      }
    });
    window.addEventListener('offline', () => showNetworkToast(false));

    // ---- Popup "Pasang app" ----
    // Muncul 5 detik tiap app dibuka (dan lagi setiap browser di-refresh), lalu
    // hilang sendiri. TIDAK pernah muncul lagi setelah app benar-benar terpasang
    // (event appinstalled, atau dibuka dalam mode standalone).
    // Tidak ada catatan "jangan tampilkan lagi" — sengaja: tombol Pasang permanen
    // di header & tile Dashboard sudah dihapus, jadi ini satu-satunya jalan pasang.
    const INSTALL_PROMPT_MS = 5000;
    let deferredPrompt = null;
    let installTimer = null;
    let installEventFired = false; // beforeinstallprompt sudah terjadi?
    let appEntered = false;        // pengguna sudah melewati layar gerbang?

    const installPrompt = () => document.getElementById('install-prompt');
    const installCard = () => document.getElementById('install-prompt-card');

    // App sedang dibuka SEBAGAI app terpasang (bukan di tab browser)?
    function isStandalone() {
      try {
        return (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true
        );
      } catch (e) {
        return false;
      }
    }

    function showInstallPrompt() {
      const el = installPrompt();
      const card = installCard();
      if (!el || !card || isStandalone()) return;
      el.style.display = 'flex';
      // Paksa reflow supaya transisi tetap berjalan. Lebih kokoh daripada
      // requestAnimationFrame, yang tidak dipanggil saat tab sedang disembunyikan.
      void card.offsetWidth;
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
      if (installTimer) clearTimeout(installTimer);
      installTimer = setTimeout(window.hideInstallPrompt, INSTALL_PROMPT_MS);
    }

    window.hideInstallPrompt = function () {
      if (installTimer) {
        clearTimeout(installTimer);
        installTimer = null;
      }
      const el = installPrompt();
      const card = installCard();
      if (!el || !card) return;
      card.style.opacity = '0';
      card.style.transform = 'translateY(0.5rem)';
      setTimeout(() => {
        el.style.display = 'none';
      }, 220);
    };

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installEventFired = true;
      // Tampilkan hanya setelah pengguna melewati gerbang, supaya popup tidak
      // tersembunyi di baliknya (gerbang z-90, popup z-60).
      if (appEntered) showInstallPrompt();
    });

    // Sinyal dari App.jsx saat pengguna selesai melewati layar gerbang.
    // Hanya yang pertama dihitung: ganti pengguna (gerbang muncul lagi) tidak
    // boleh memunculkan popup untuk kedua kalinya.
    window.addEventListener('bm:entered', () => {
      if (appEntered) return;
      appEntered = true;
      if (installEventFired) showInstallPrompt();
    });

    window.installApp = function () {
      if (!deferredPrompt || typeof deferredPrompt.prompt !== 'function') return;
      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      promptEvent.prompt();
      return Promise.resolve(promptEvent.userChoice)
        .then((choice) => {
          if (choice && choice.outcome === 'accepted') window.hideInstallPrompt();
        })
        .catch(() => {});
    };

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      window.hideInstallPrompt();
    });
  </script>
</body>
</html>
