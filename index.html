<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bayt Mustaqbal — aplikasi manajemen keluarga: keuangan, agenda, absensi, dan service.">
  <meta name="theme-color" content="#0A192F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Fonts: Plus Jakarta Sans (teks) + Fira Code (angka/KPI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS diproses PostCSS (lihat tailwind.config.js) via App.css -->

  <!-- App Icon -->
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <title>Bayt Mustaqbal — Manajemen Keluarga</title>
</head>
<body class="bg-canvas font-sans text-ink antialiased">
  <!-- Skip link (aksesibilitas keyboard) -->
  <a href="#main"
     class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-cta focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">
    Lewati ke konten utama
  </a>

  <div id="root"></div>

  <!-- PWA Install Prompt (di atas bottom nav pada mobile) -->
  <div id="install-prompt"
       class="fixed inset-x-0 bottom-[calc(3.5rem_+_env(safe-area-inset-bottom))] z-[60] translate-y-[calc(100%_+_7rem)] border-t border-line bg-canvas/90 p-3 backdrop-blur-xl transition-transform duration-200 sm:p-4 lg:bottom-0"
       style="display: none;">
    <div class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-3">
      <div class="flex min-w-0 flex-1 items-center gap-3">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-brand/25 bg-brandtint text-brand sm:h-11 sm:w-11">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
        </span>
        <div class="min-w-0 leading-tight">
          <p class="truncate text-sm font-semibold">Pasang Bayt Mustaqbal</p>
          <p class="truncate text-xs text-mutedfg">Tambah ke layar utama untuk akses cepat</p>
        </div>
      </div>
      <div class="flex shrink-0 items-center gap-2">
        <button onclick="window.skipInstallPrompt()"
                class="min-h-[44px] rounded-full px-4 text-sm font-medium text-mutedfg transition-colors hover:bg-muted hover:text-ink">
          Nanti
        </button>
        <button onclick="window.installApp()"
                class="inline-flex min-h-[44px] items-center gap-2 rounded-xl bg-gradient-to-r from-[#1D4ED8] to-[#2563EB] px-5 text-sm font-semibold text-white shadow-glow transition-transform hover:from-[#1E40AF] hover:to-[#1D4ED8] active:scale-[0.99]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="m7 10 5 5 5-5" />
            <path d="M12 15V3" />
          </svg>
          Pasang
        </button>
      </div>
    </div>
  </div>

  <!-- React entry -->
  <script type="module" src="/main.jsx"></script>

  <!-- Network status + PWA install logic -->
  <script>
    // ---- Notifikasi perubahan status jaringan (toast sementara) ----
    // Status "offline" yang menetap ditampilkan banner di dalam <main> (App.jsx),
    // jadi bar ini hanya muncul sesaat saat status berubah → tidak dobel.
    let networkToastTimer = null;
    function showNetworkToast(isOnline) {
      const existing = document.getElementById('network-status-bar');
      if (existing) existing.remove();
      if (networkToastTimer) clearTimeout(networkToastTimer);

      const bar = document.createElement('div');
      bar.id = 'network-status-bar';
      bar.setAttribute('role', 'status');
      bar.setAttribute('aria-live', 'polite');
      bar.className =
        'fixed inset-x-0 top-0 z-[70] flex items-center justify-center gap-2 px-4 py-2 text-center text-sm font-medium text-white transition-transform duration-200';
      bar.style.backgroundColor = isOnline ? '#155E75' : '#BE123C';
      bar.innerHTML =
        '<span aria-hidden="true" style="display:inline-block;width:8px;height:8px;border-radius:9999px;background:currentColor;opacity:.9"></span>' +
        (isOnline ? 'Tersambung kembali' : 'Koneksi terputus');

      document.body.appendChild(bar);

      networkToastTimer = setTimeout(() => {
        bar.style.transform = 'translateY(-100%)';
        setTimeout(() => bar.remove(), 250);
      }, 3000);
    }

    window.addEventListener('online', () => {
      showNetworkToast(true);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready
          .then((reg) => reg.sync && reg.sync.register('family-api-sync'))
          .catch(() => {});
      }
    });
    window.addEventListener('offline', () => showNetworkToast(false));

    // ---- PWA install prompt ----
    let deferredPrompt = null;
    const installPrompt = () => document.getElementById('install-prompt');

    function showInstallPrompt() {
      const el = installPrompt();
      if (!el) return;
      el.style.display = 'block';
      requestAnimationFrame(() => {
        el.style.transform = 'translateY(0)';
      });
    }

    function hideInstallPrompt() {
      const el = installPrompt();
      if (!el) return;
      el.style.transform = 'translateY(100%)';
      setTimeout(() => {
        el.style.display = 'none';
      }, 200);
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (localStorage.getItem('skipInstallPrompt') !== 'true') {
        showInstallPrompt();
      }
    });

    window.installApp = function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choice) => {
        if (choice.outcome === 'accepted') hideInstallPrompt();
        deferredPrompt = null;
      });
    };

    window.skipInstallPrompt = function () {
      hideInstallPrompt();
      localStorage.setItem('skipInstallPrompt', 'true');
    };

    window.addEventListener('appinstalled', () => {
      hideInstallPrompt();
      localStorage.removeItem('skipInstallPrompt');
    });
  </script>
</body>
</html>
